<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Shield Accent Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="120" height="120" rx="32" fill="url(#adminBg)" />
  <rect x="1.5" y="1.5" width="117" height="117" rx="30.5" stroke="#4338ca" stroke-width="2" stroke-opacity="0.6" />

  <!-- Security Shield Container -->
  <path d="M60 22 C76 22 88 28 88 28 C88 56 78 78 60 92 C42 78 32 56 32 28 C32 28 44 22 60 22 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.18" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- System IT Terminal / Code Management Badge -->
  <!-- Gear / Cog behind -->
  <circle cx="60" cy="52" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Server / Terminal Sliders inside -->
  <path d="M54 48 L58 52 L54 56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="62" y1="56" x2="68" y2="56" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

  <!-- Admin Key / Tool indicator -->
  <path d="M51 72 H69 M54 77 H66 M57 82 H63" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />

  <!-- Status Online Indicator -->
  <circle cx="84" cy="36" r="6" fill="#10b981" />
  <circle cx="84" cy="36" r="3" fill="#ffffff" />
</svg>
