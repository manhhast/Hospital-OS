services:
  - type: web
    name: hospital-os
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: EXTERNAL_DATABASE_URL
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
